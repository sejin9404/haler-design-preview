<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>haler preview — Desktop vs iPhone</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F1216;font-family:-apple-system,system-ui,sans-serif;color:#9AA4B2;overflow:hidden}
header{height:44px;display:flex;align-items:center;gap:16px;padding:0 18px;font-size:12.5px}
header b{color:#E6EBF2;font-weight:600}
.sync{margin-left:auto;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:#DCE3EC}
.sw{width:34px;height:20px;border-radius:999px;background:#2A313B;position:relative;transition:background .25s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}
.sync.on .sw{background:#0084FF}
.sync.on .sw::after{transform:translateX(14px)}
.stage{display:flex;gap:22px;align-items:flex-start;justify-content:center;padding:0 18px}
.frame{position:relative;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.09)}
@supports (corner-shape:squircle){.frame{corner-shape:squircle}}
.frame iframe{border:0;transform-origin:0 0;display:block}
.island{position:absolute;left:50%;transform:translateX(-50%);background:#000;border-radius:999px;z-index:6;pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;color:#fff;pointer-events:none;font-family:-apple-system,system-ui,sans-serif;font-weight:600}
.sb-time{letter-spacing:.02em}
.sb-icons{display:flex;align-items:center}
.sb-icons svg{display:block}
</style></head><body>
<header><b>haler preview</b><span id="info">…</span><span class="sync" id="sync"><span>스크롤 동기화</span><span class="sw"></span></span></header>
<div class="stage" id="stage">
  <div class="frame" id="fd"><iframe id="ifd" src="/"></iframe></div>
  <div class="frame" id="fp"><iframe id="ifp" src="/?safe=62"></iframe><div class="island" id="island"></div>
    <div class="sbar" id="sbar">
      <span class="sb-time">9:41</span>
      <span class="sb-icons">
        <svg viewBox="0 0 20 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3.5" width="3" height="8.5" rx="1"/><rect x="15" y="1" width="3" height="11" rx="1"/></svg>
        <svg viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.6c2.6 0 5 1 6.8 2.7l1.6-1.7A11.6 11.6 0 0 0 8.5 0C5.2 0 2.2 1.4.1 3.6l1.6 1.7A9.3 9.3 0 0 1 8.5 2.6z"/><path d="M8.5 6.4c1.6 0 3 .6 4.1 1.6l1.7-1.7a8.2 8.2 0 0 0-11.6 0l1.7 1.7c1.1-1 2.5-1.6 4.1-1.6z"/><path d="M8.5 10.2c.7 0 1.4.3 1.9.8L8.5 13l-1.9-2c.5-.5 1.2-.8 1.9-.8z"/></svg>
        <svg viewBox="0 0 27 13" fill="none" stroke="currentColor"><rect x="1" y="1" width="21" height="11" rx="3.5" stroke-width="1" opacity=".45"/><rect x="3" y="3" width="15" height="7" rx="1.8" fill="currentColor" stroke="none"/><path d="M24.5 4.5v4a2.2 2.2 0 0 0 0-4z" fill="currentColor" stroke="none" opacity=".45"/></svg>
      </span>
    </div></div>
</div>
<script>
(function(){
  var D={w:1920,h:1080}, P={w:402,h:874}; /* iPhone 16 Pro 실스펙 */
  function layout(){
    var H=innerHeight-74;
    var sd=H/D.h, sp=H/P.h;
    var total=D.w*sd+P.w*sp+22+36;
    var k=Math.min(1,innerWidth/total);
    sd*=k; sp*=k; H*=k;
    set('ifd',D,sd); set('ifp',P,sp);
    size('fd',D.w*sd,H); size('fp',P.w*sp,H);
    /* 실기기 화면 형태: 데스크탑 모서리 살짝, 아이폰 16 Pro 라운드 55pt + 다이내믹 아일랜드 */
    document.getElementById('fd').style.borderRadius=(10*sd)+'px';
    /* iPhone 16 Pro 실측: 곡률 62pt(ScreenCorners), 아일랜드 126×36.7pt @ y14.3, 상태바 54pt, safe-top 62pt */
    document.getElementById('fp').style.borderRadius=(62*sp)+'px';
    var isl=document.getElementById('island');
    isl.style.width=(126*sp)+'px'; isl.style.height=(36.7*sp)+'px'; isl.style.top=(14.3*sp)+'px';
    /* 상태바 콘텐츠는 아일랜드 세로 중심(y≈32.6pt)에 정렬 */
    var sb=document.getElementById('sbar');
    sb.style.height=(65.3*sp)+'px'; sb.style.padding='0 '+(30*sp)+'px 0 '+(38*sp)+'px'; sb.style.fontSize=(17*sp)+'px';
    var ic=sb.querySelectorAll('.sb-icons svg');
    ic[0].style.width=(19*sp)+'px'; ic[0].style.height=(12*sp)+'px'; ic[0].style.marginRight=(7*sp)+'px';
    ic[1].style.width=(17*sp)+'px'; ic[1].style.height=(12*sp)+'px'; ic[1].style.marginRight=(7*sp)+'px';
    ic[2].style.width=(27*sp)+'px'; ic[2].style.height=(13*sp)+'px';
    document.getElementById('info').textContent='Desktop '+Math.round(sd*100)+'% · iPhone '+Math.round(sp*100)+'%';
  }
  function set(id,dev,s){var f=document.getElementById(id);f.width=dev.w;f.height=dev.h;f.style.width=dev.w+'px';f.style.height=dev.h+'px';f.style.transform='scale('+s+')';}
  function size(id,w,h){var e=document.getElementById(id);e.style.width=w+'px';e.style.height=h+'px';}
  layout(); addEventListener('resize',layout);

  /* 스크롤 동기화 (비율 기반) */
  var syncBtn=document.getElementById('sync'), syncOn=false, lock=false;
  syncBtn.addEventListener('click',function(){ syncOn=!syncOn; syncBtn.classList.toggle('on',syncOn); });
  function hook(fromId,toId){
    var f=document.getElementById(fromId), t=document.getElementById(toId);
    f.addEventListener('load',function(){
      var fw=f.contentWindow;
      fw.addEventListener('scroll',function(){
        if(!syncOn||lock) return;
        lock=true;
        var fd=fw.document.documentElement;
        var td=t.contentWindow.document.documentElement;
        var ratio=fw.scrollY/Math.max(1,fd.scrollHeight-fw.innerHeight);
        t.contentWindow.scrollTo(0,ratio*Math.max(0,td.scrollHeight-t.contentWindow.innerHeight));
        requestAnimationFrame(function(){lock=false;});
      },{passive:true});
    });
  }
  hook('ifd','ifp'); hook('ifp','ifd');
})();
</script>
</body></html>
